services:
  coordinator:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=coordinator,docker
    ports:
      - "8080:8080"
    volumes:
      - ./data/index/wikipedia-dev-10k:/app/data/index/wikipedia-dev-10k:ro
    depends_on:
      - worker-1
      - worker-2
      - worker-3
      - worker-4

  worker-1:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=worker,docker
      - SHARDSEARCH_WORKER_NODE_ID=worker-1
      - SHARDSEARCH_WORKER_INDEX_DIRECTORY=/app/data/index/wikipedia-dev-10k
    volumes:
      - ./data/index/wikipedia-dev-10k:/app/data/index/wikipedia-dev-10k:ro

  worker-2:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=worker,docker
      - SHARDSEARCH_WORKER_NODE_ID=worker-2
      - SHARDSEARCH_WORKER_INDEX_DIRECTORY=/app/data/index/wikipedia-dev-10k
    volumes:
      - ./data/index/wikipedia-dev-10k:/app/data/index/wikipedia-dev-10k:ro

  worker-3:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=worker,docker
      - SHARDSEARCH_WORKER_NODE_ID=worker-3
      - SHARDSEARCH_WORKER_INDEX_DIRECTORY=/app/data/index/wikipedia-dev-10k
    volumes:
      - ./data/index/wikipedia-dev-10k:/app/data/index/wikipedia-dev-10k:ro

  worker-4:
    build:
      context: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=worker,docker
      - SHARDSEARCH_WORKER_NODE_ID=worker-4
      - SHARDSEARCH_WORKER_INDEX_DIRECTORY=/app/data/index/wikipedia-dev-10k
    volumes:
      - ./data/index/wikipedia-dev-10k:/app/data/index/wikipedia-dev-10k:ro
